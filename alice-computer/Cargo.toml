[package]
name = "alice-computer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native sidecar executable for Alice Computer Use"
publish = false

[[bin]]
name = "alice-computer"
path = "src/main.rs"

[dependencies]
alice-computer-use-core = { path = "../alice-computer-use-core" }
alice-computer-use-runtime = { path = "../alice-computer-use-runtime" }
alice-computer-use-sidecar-protocol = { path = "../alice-computer-use-sidecar-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
