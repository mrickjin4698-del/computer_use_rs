[package]
name = "alice-computer-use-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Windows observation and action runtime for Alice Computer Use"
publish = false

[dependencies]
alice-computer-use-core = { path = "../alice-computer-use-core" }
async-trait = "0.1"
png = "0.18"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
